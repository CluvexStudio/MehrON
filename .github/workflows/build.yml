name: Build and Release MehrN

on:
  push:
    branches:
      - main
      - Beta
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (leave empty to use Directory.Build.props version)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve Version
        id: version_step
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}" -ne "") {
            $tag = "${{ inputs.release_tag }}"
            if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          } else {
            $propVer = [xml](Get-Content ./v2rayN/Directory.Build.props)
            $v = $propVer.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $ref = "${{ github.ref_name }}"
            $tag = if ($ref -eq "Beta" -and -not $v.Contains("-beta")) { "v$v-beta" } else { "v$v" }
          }
          Write-Host "Resolved Version Tag: $tag"
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build & Publish MehrN
        shell: pwsh
        run: |
          $outDir = "./dist/MehrN-windows-64"
          dotnet publish ./v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o $outDir

          dotnet publish ./v2rayN/AmazTool/AmazTool.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o $outDir

          # Remove debug symbols if any
          Get-ChildItem -Path $outDir -Filter "*.pdb" -Recurse | Remove-Item -Force

          if (-not (Test-Path "$outDir/MehrN.exe")) {
            throw "MehrN.exe was not built or found in $outDir"
          }
          if (-not (Test-Path "$outDir/AmazTool.exe")) {
            throw "AmazTool.exe was not built or found in $outDir"
          }

      - name: Bundle Core Binaries
        shell: pwsh
        run: |
          $outDir = "./dist/MehrN-windows-64"
          $binDir = "$outDir/bin"
          New-Item -ItemType Directory -Path "$binDir/xray" -Force | Out-Null
          New-Item -ItemType Directory -Path "$binDir/sing_box" -Force | Out-Null
          New-Item -ItemType Directory -Path "$binDir/mihomo" -Force | Out-Null
          New-Item -ItemType Directory -Path "$binDir/sni-spoofing" -Force | Out-Null

          # Build standalone SNI Spoofing engine
          Write-Host "Building standalone SNI Spoofing engine..."
          pip install --upgrade pydivert pyinstaller
          Push-Location "./_upstream_sni_spoofing"
          pyinstaller --noconfirm --onedir --name sni-spoofing --collect-all pydivert main.py
          Copy-Item -Path "dist/sni-spoofing/_internal/pydivert/windivert_dll/WinDivert64.*" -Destination "dist/sni-spoofing/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "dist/sni-spoofing/WinDivert64.sys" -Destination "dist/sni-spoofing/WinDivert.sys" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "dist/sni-spoofing/_internal/pydivert/windivert_dll/WinDivert64.sys" -Destination "dist/sni-spoofing/_internal/pydivert/windivert_dll/WinDivert.sys" -Force -ErrorAction SilentlyContinue
          Pop-Location
          Copy-Item -Path "_upstream_sni_spoofing/dist/sni-spoofing/*" -Destination "$binDir/sni-spoofing/" -Recurse -Force

          # Download Rust SNI Spoofing engine (sni-spoof-rs)
          Write-Host "Downloading Rust SNI Spoofing engine..."
          $rustZip = "sni-spoof-rs.zip"
          curl.exe -L -s -o $rustZip "https://github.com/therealaleph/sni-spoofing-rust/releases/latest/download/sni-spoof-rs-windows-amd64.zip"
          Expand-Archive -Path $rustZip -DestinationPath "rust-extracted" -Force
          Copy-Item -Path "rust-extracted/sni-spoof-rs.exe" -Destination "$binDir/sni-spoofing/" -Force
          Copy-Item -Path "rust-extracted/WinDivert64.sys" -Destination "$binDir/sni-spoofing/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "rust-extracted/WinDivert.dll" -Destination "$binDir/sni-spoofing/" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $rustZip, "rust-extracted" -Recurse -Force -ErrorAction SilentlyContinue

          # Download latest Xray-core (patterniha v26.9.13)
          Write-Host "Downloading latest Xray-core..."
          $xrayZip = "xray-latest.zip"
          curl.exe -L -s -o $xrayZip "https://github.com/patterniha/Xray-core/releases/latest/download/Xray-windows-64.zip"
          Expand-Archive -Path $xrayZip -DestinationPath "xray-extracted" -Force
          Copy-Item -Path "xray-extracted/xray.exe" -Destination "$binDir/xray/" -Force
          Copy-Item -Path "xray-extracted/geosite.dat" -Destination "$binDir/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "xray-extracted/geoip.dat" -Destination "$binDir/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "xray-extracted/geosite.dat" -Destination "$binDir/xray/" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "xray-extracted/geoip.dat" -Destination "$binDir/xray/" -Force -ErrorAction SilentlyContinue

          # Download v2rayN-core-bin bundle for wintun, srss rules, and base utilities
          Write-Host "Downloading core binaries bundle..."
          $coreZip = "core-bin.zip"
          curl.exe -L -s -o $coreZip "https://raw.githubusercontent.com/2dust/v2rayN-core-bin/refs/heads/master/v2rayN-windows-64.zip"
          Expand-Archive -Path $coreZip -DestinationPath "core-extracted" -Force

          # Copy base utilities and shared libraries
          $coreRoot = if (Test-Path "core-extracted/v2rayN-windows-64/bin") { "core-extracted/v2rayN-windows-64/bin" } else { "core-extracted/bin" }
          if (Test-Path "$coreRoot/xray/wintun.dll") {
            Copy-Item -Path "$coreRoot/xray/wintun.dll" -Destination "$binDir/xray/" -Force
            Copy-Item -Path "$coreRoot/xray/wintun.dll" -Destination "$binDir/sing_box/" -Force
            Copy-Item -Path "$coreRoot/xray/wintun.dll" -Destination "$binDir/mihomo/" -Force
          }
          if (Test-Path "$coreRoot/EnableLoopback.exe") {
            Copy-Item -Path "$coreRoot/EnableLoopback.exe" -Destination "$binDir/" -Force
          }
          if (Test-Path "$coreRoot/Country.mmdb") {
            Copy-Item -Path "$coreRoot/Country.mmdb" -Destination "$binDir/" -Force
            Copy-Item -Path "$coreRoot/Country.mmdb" -Destination "$binDir/mihomo/" -Force
          }
          if (Test-Path "$coreRoot/geoip.metadb") {
            Copy-Item -Path "$coreRoot/geoip.metadb" -Destination "$binDir/" -Force
            Copy-Item -Path "$coreRoot/geoip.metadb" -Destination "$binDir/mihomo/" -Force
          }
          if (Test-Path "$coreRoot/srss") {
            Copy-Item -Path "$coreRoot/srss" -Destination "$binDir/" -Recurse -Force
          }

          # Download latest sing-box (v1.14.1)
          Write-Host "Downloading latest sing-box (v1.14.1)..."
          $singZip = "sing-box-latest.zip"
          curl.exe -L -s -o $singZip "https://github.com/SagerNet/sing-box/releases/download/v1.14.1/sing-box-1.14.1-windows-amd64.zip"
          Expand-Archive -Path $singZip -DestinationPath "sing-extracted" -Force
          $singExe = Get-ChildItem -Path "sing-extracted" -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if ($singExe) {
            Copy-Item -Path $singExe.FullName -Destination "$binDir/sing_box/sing-box.exe" -Force
          }
          if (Test-Path "$coreRoot/sing_box/libcronet.dll") {
            Copy-Item -Path "$coreRoot/sing_box/libcronet.dll" -Destination "$binDir/sing_box/" -Force
          }

          # Download latest mihomo (v1.19.31)
          Write-Host "Downloading latest mihomo (v1.19.31)..."
          $mihomoZip = "mihomo-latest.zip"
          curl.exe -L -s -o $mihomoZip "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-windows-amd64-compatible-v1.19.31.zip"
          Expand-Archive -Path $mihomoZip -DestinationPath "mihomo-extracted" -Force
          $mihomoExe = Get-ChildItem -Path "mihomo-extracted" -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($mihomoExe) {
            Copy-Item -Path $mihomoExe.FullName -Destination "$binDir/mihomo/mihomo.exe" -Force
            Copy-Item -Path $mihomoExe.FullName -Destination "$binDir/mihomo/$($mihomoExe.Name)" -Force
          }

          # Download latest Aether
          Write-Host "Downloading latest Aether..."
          $aetherZip = "aether-latest.zip"
          curl.exe -L -s -o $aetherZip "https://github.com/CluvexStudio/Aether/releases/latest/download/aether-windows-x86_64.zip"
          Expand-Archive -Path $aetherZip -DestinationPath "aether-extracted" -Force
          $aetherExe = Get-ChildItem -Path "aether-extracted" -Recurse -Filter "aether.exe" | Select-Object -First 1
          if ($aetherExe) {
            New-Item -ItemType Directory -Path "$binDir/aether" -Force | Out-Null
            Copy-Item -Path $aetherExe.FullName -Destination "$binDir/aether/aether.exe" -Force
            if (Test-Path "$($aetherExe.DirectoryName)/pt") {
              Copy-Item -Path "$($aetherExe.DirectoryName)/pt" -Destination "$binDir/aether/" -Recurse -Force
            }
          }

          # Verify core binaries exist and print versions
          if (-not (Test-Path "$binDir/xray/xray.exe")) {
            throw "xray.exe was not found or copied into bin/xray/"
          }
          if (-not (Test-Path "$binDir/sing_box/sing-box.exe")) {
            throw "sing-box.exe was not found or copied into bin/sing_box/"
          }
          if (-not (Test-Path "$binDir/mihomo/mihomo.exe")) {
            throw "mihomo.exe was not found or copied into bin/mihomo/"
          }
          if (-not (Test-Path "$binDir/aether/aether.exe")) {
            throw "aether.exe was not found or copied into bin/aether/"
          }
          if (-not (Test-Path "$binDir/sni-spoofing/sni-spoof-rs.exe")) {
            throw "sni-spoof-rs.exe was not found in bin/sni-spoofing/"
          }
          if (-not (Test-Path "$binDir/sni-spoofing/sni-spoofing.exe")) {
            throw "sni-spoofing.exe was not found in bin/sni-spoofing/"
          }

          Write-Host "Verifying bundled core versions:"
          & "$binDir/xray/xray.exe" version
          & "$binDir/sing_box/sing-box.exe" version
          & "$binDir/mihomo/mihomo.exe" -v
          & "$binDir/aether/aether.exe" --version

          # Download official rules containing gfw, geolocation-!cn, etc.
          Write-Host "Downloading geo rules..."
          curl.exe -L -s -o "$binDir/geosite.dat" "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
          curl.exe -L -s -o "$binDir/geoip.dat" "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
          Copy-Item -Path "$binDir/geosite.dat" -Destination "$binDir/xray/" -Force
          Copy-Item -Path "$binDir/geoip.dat" -Destination "$binDir/xray/" -Force

          # Cleanup download artifacts
          Remove-Item -Path $coreZip, "core-extracted", $xrayZip, "xray-extracted", $singZip, "sing-extracted", $mihomoZip, "mihomo-extracted", $aetherZip, "aether-extracted" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Package Zip Archive
        shell: pwsh
        run: |
          $outDir = "./dist/MehrN-windows-64"
          $zipPath = "./MehrN-windows-64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$outDir/*" -DestinationPath $zipPath -Force
          $size = (Get-Item $zipPath).Length / 1MB
          Write-Host ("Created archive: {0} ({1:N2} MB)" -f $zipPath, $size)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MehrN-windows-64
          path: MehrN-windows-64.zip
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref_type == 'tag' || inputs.create_release == true || github.ref_name == 'main' || github.ref_name == 'Beta'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.ref_name }}
          body: |
            ## MehrN ${{ env.TAG_NAME }}

            ### ✨ Improvements & Highlights
            - **⚡ Native Architecture**: Unified and refined native Windows runtime for maximum responsiveness and minimal resource usage.
            - **🌐 Aether Engine Integration**: Added built-in support and distribution for the Aether censorship circumvention core (MASQUE, WireGuard, and pluggable transports).
            - **🧠 Memory & Performance Optimizations**: Active working-set management and dynamic heap tuning for a lightweight background footprint.
            - **🎨 UI Polish & Stability**: Refined interface components, enhanced status indicators, and general stability improvements.
            - **📦 Core Engines & Routing**: Updated high-performance core binaries and latest geo-routing rules.

            ---
            *Platform: Windows x64 (Portable)*
          files: MehrN-windows-64.zip
          draft: false
          prerelease: ${{ github.ref_name == 'Beta' }}
